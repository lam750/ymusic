name: build-nro
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install portlibs
        run: dkp-pacman -Syu --noconfirm switch-curl switch-mbedtls switch-zlib
      - name: Add template Makefile/icon if missing, set LIBS
        run: |
          T=/opt/devkitpro/examples/switch/templates/application
          cp -n $T/Makefile . || true
          cp -n $T/icon.jpg . || true
          sed -i 's/^LIBS[[:space:]]*:=.*/LIBS := -lcurl -lmbedtls -lmbedx509 -lmbedcrypto -lz -lnx/' Makefile
          grep -n '^LIBS' Makefile
      - name: Build
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: ymusic-switch-nro
          path: "*.nro"
